name: terraform-service-apply

on:
  push:
    branches: ["main"]
    paths:
      - "service/**"
      - ".github/workflows/terraform-service-apply.yml"

permissions:
  id-token: write
  contents: read

concurrency:
  group: terraform-service-main
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: service

    env:
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
      TF_VAR_project_id: ${{ secrets.GCP_PROJECT_ID }}

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.6.6"

      # GCP Workload Identity（state 適用後、出力値に差し替えること）
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: "projects/PROJECT_NUMBER/locations/global/workloadIdentityPools/github-pool/providers/github-provider"
          service_account: "github-actions-terraform@YOUR_PROJECT_ID.iam.gserviceaccount.com"
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Setup Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - run: terraform fmt -check -recursive
      - run: terraform init -upgrade
      - run: terraform apply -auto-approve
